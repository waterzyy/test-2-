name: Build Shine (Minecraft 26.3)

on:
  push:
    branches: [arena/de577dd3-test-2]
  pull_request:
    branches: [arena/de577dd3-test-2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shine-26.3-jar
          path: build/libs/*.jar
          retention-days: 7
